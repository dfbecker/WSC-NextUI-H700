# Beetle WonderSwan (mednafen_wswan) core options
#
# NOTE: no "bind" lines on purpose. If a pak.cfg defines any binding, minarch
# replaces its full default button table with ONLY those binds. The default
# table already maps the WonderSwan correctly and exposes every button in
# Menu > Controls for remapping:
#   D-Pad            -> X Cursor (primary pad)
#   L1 / R1          -> Y Cursor Left / Right   (second pad)
#   L2 / R2          -> Y Cursor Down / Up      (second pad)
#   A / B            -> A / B buttons
#   Start            -> Start
#   Select           -> Rotate screen + active D-Pad

# The WonderSwan runs at a native 75Hz; 60hz_mode avoids tearing / FPS drops
# on 60Hz displays (applies a light frameskip, dropping 1 of every 5 frames).
wswan_60hz_mode = "enabled"

# 'auto' reassigns the active pad based on screen rotation, so after rotating a
# vertical game (Select) the D-Pad drives the now-active cursor.
wswan_rotate_keymap = "auto"
